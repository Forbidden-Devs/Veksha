<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veksha Study Focus</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <img src="../../icons/icon128.png" alt="" />
      <p class="eyebrow">STUDY FOCUS</p>
      <h1 id="intention">Your study session is still active</h1>
      <p id="remaining"></p>
      <div id="pause" aria-live="polite"></div>
      <div class="actions">
        <button id="return" class="primary" type="button">Return to study</button>
        <button id="access" type="button" disabled>Open this site for 10 minutes</button>
        <button id="end" type="button">End focus session</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
