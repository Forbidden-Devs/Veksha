services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veksha
      POSTGRES_USER: veksha
      POSTGRES_PASSWORD: veksha
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veksha -d veksha"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - veksha-postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: veksha_test
      POSTGRES_USER: veksha
      POSTGRES_PASSWORD: veksha
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veksha -d veksha_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - veksha-redis:/data

  backend:
    build:
      context: ./veksha-backend
    environment:
      DATABASE_URL: postgresql://veksha:veksha@postgres:5432/veksha
      REDIS_URL: redis://redis:6379/0
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:4173
      VEKSHA_DEBUG_API: ${VEKSHA_DEBUG_API:-1}
      VEKSHA_DEV_ALL_FEATURES: ${VEKSHA_DEV_ALL_FEATURES:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_SMART_MODEL: ${OPENAI_SMART_MODEL:-gpt-4.1}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-http://speech-platform:8080}
      SPEECH_SHARED_SECRET: ${SPEECH_SHARED_SECRET:-local-development-shared-secret}
      SPEECH_DEFAULT_VOICE_ID: ${SPEECH_DEFAULT_VOICE_ID:-}
      SPEECH_TIMEOUT: ${SPEECH_TIMEOUT:-60s}
      VEKSHA_PHRASE_MINING_ENABLED: ${VEKSHA_PHRASE_MINING_ENABLED:-1}
      VEKSHA_CORE_V2_LLM_TIMEOUT_SECONDS: ${VEKSHA_CORE_V2_LLM_TIMEOUT_SECONDS:-30}
      VEKSHA_CORE_V2_TRANSLATION_MODEL: ${VEKSHA_CORE_V2_TRANSLATION_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_PHRASE_MINING_MODEL: ${VEKSHA_CORE_V2_PHRASE_MINING_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_DICTIONARY_MODEL: ${VEKSHA_CORE_V2_DICTIONARY_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_SENTENCE_MINING_MODEL: ${VEKSHA_CORE_V2_SENTENCE_MINING_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_GRAMMAR_MODEL: ${VEKSHA_CORE_V2_GRAMMAR_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_SUBTITLES_MODEL: ${VEKSHA_CORE_V2_SUBTITLES_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_I18N_MODEL: ${VEKSHA_CORE_V2_I18N_MODEL:-gpt-5.6-luna}
      VEKSHA_CORE_V2_TRAINING_MODEL: ${VEKSHA_CORE_V2_TRAINING_MODEL:-gpt-5.6-terra}
      VEKSHA_CORE_V2_LESSON_MODEL: ${VEKSHA_CORE_V2_LESSON_MODEL:-gpt-5.6-terra}
      VEKSHA_CORE_V2_READING_MODEL: ${VEKSHA_CORE_V2_READING_MODEL:-gpt-5.6-luna}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_WEBHOOK_SECRET: ${VEKSHA_BOT_WEBHOOK_SECRET:-}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-local-admin-secret}
      ADMIN_DATABASE_SECRET: ${ADMIN_DATABASE_SECRET:-local-database-secret}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      VEKSHA_OCR_MIN_CONFIDENCE: ${VEKSHA_OCR_MIN_CONFIDENCE:-0.55}
      VEKSHA_OCR_VISION_MODEL: ${VEKSHA_OCR_VISION_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - speech-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: veksha-web/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: ./veksha-admin
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    environment:
      PORT: 4173
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4173/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  extension-build:
    build:
      context: ./veksha-extension
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    volumes:
      - ./veksha-extension/dist:/output

  tgbot:
    profiles: ["telegram"]
    build:
      context: ./veksha-tgbot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VEKSHA_BACKEND_URL: http://backend:8000
      VEKSHA_BOT_WEBHOOK_SECRET: ${VEKSHA_BOT_WEBHOOK_SECRET:-}
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veksha-postgres:
  veksha-redis:

networks:
  speech-platform:
    external: true
    name: ${SPEECH_DOCKER_NETWORK:-speech-platform-local}
