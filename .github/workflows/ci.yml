name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      bot: ${{ steps.filter.outputs.bot }}
      extension: ${{ steps.filter.outputs.extension }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Select affected components
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt

          matches() {
            grep -Eq "$1" changed-files.txt
          }

          all=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || matches '^\.github/(workflows|dependabot\.yml)'; then
            all=true
          fi

          backend=false
          bot=false
          extension=false
          web=false

          if [[ "$all" == true ]] || matches '^veksha-backend/'; then backend=true; fi
          if [[ "$all" == true ]] || matches '^veksha-tgbot/'; then bot=true; fi
          if [[ "$all" == true ]] || matches '^veksha-extension/'; then extension=true; fi
          if [[ "$all" == true ]] || matches '^veksha-web/|^veksha-extension/'; then web=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_python-checks.yml
    with:
      display-name: Backend checks
      working-directory: veksha-backend
      test-command: python -m pytest -q tests

  bot:
    name: Telegram bot
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    uses: ./.github/workflows/_python-checks.yml
    with:
      display-name: Telegram bot checks
      working-directory: veksha-tgbot
      test-command: python -m pytest -q tests

  extension:
    name: Extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    uses: ./.github/workflows/_node-checks.yml
    with:
      target: extension

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/_node-checks.yml
    with:
      target: web

  ci:
    name: CI
    if: always()
    needs: [changes, backend, bot, extension, web]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BOT_RESULT: ${{ needs.bot.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          for result in "$CHANGES_RESULT" "$BACKEND_RESULT" "$BOT_RESULT" "$EXTENSION_RESULT" "$WEB_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required CI job finished with: $result"
              exit 1
            fi
          done
