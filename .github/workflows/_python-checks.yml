name: Reusable Python checks

on:
  workflow_call:
    inputs:
      display-name:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      test-command:
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: ${{ inputs.display-name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working-directory }}/requirements.txt
            ${{ inputs.working-directory }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check for critical Python errors
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: ${{ inputs.test-command }}
