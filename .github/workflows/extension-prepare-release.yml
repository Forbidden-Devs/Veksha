name: Prepare extension release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-extension-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veksha-extension
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veksha-extension/package-lock.json

      - run: npm ci

      - id: version
        name: Update version files
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(node scripts/set-version.mjs "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release package
        run: |
          npm run typecheck
          npm run test:version
          npm run version:check
          npm run release

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/extension-v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists. Finish or close its release PR first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json manifest.json
          git commit -m "Prepare extension v$VERSION"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$branch" \
            --title "Release extension v$VERSION" \
            --body "Automated version bump for Veksha Extension v$VERSION. Merge after CI succeeds; the merge will create the tag, archives, checksums, and GitHub Release."
