name: Reusable Node checks

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    if: inputs.target == 'extension'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veksha-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veksha-extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:version
      - run: npm run version:check
      - run: npm run release

      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: veksha-extension/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web checks
    if: inputs.target == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            veksha-extension/package-lock.json
            veksha-web/package-lock.json

      - name: Install extension dependencies used by shared sources
        working-directory: veksha-extension
        run: npm ci

      - name: Install web dependencies
        working-directory: veksha-web
        run: npm ci

      - name: Typecheck web and shared sources
        working-directory: veksha-web
        run: npm run typecheck

      - name: Build web
        working-directory: veksha-web
        run: npm run build

  admin:
    name: Admin checks
    if: inputs.target == 'admin'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veksha-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
