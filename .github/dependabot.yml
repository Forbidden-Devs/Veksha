version: 2
updates:
  - package-ecosystem: pip
    directory: /veksha-backend
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /veksha-tgbot
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /veksha-extension
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /veksha-web
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
